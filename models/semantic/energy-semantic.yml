version: 2

models:
  - name: time_spine_daily
    description: Daily time spine for MetricFlow
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        granularity: day

semantic_models:
  - name: emission_intensity
    description: >
      Daily emission metrics aggregated at the country level.
    model: ref('fct_emission_intensity')
    defaults:
      agg_time_dimension: date

    entities:
      - name: country
        type: primary
        expr: country

    dimensions:
      - name: date
        type: time
        expr: date
        type_params:
          time_granularity: day

    measures:
      - name: total_emissions
        description: Total emissions in metric tons.
        agg: sum
        expr: total_emissions

metrics:
  - name: total_emissions
    description: The total emissions
    label: total_emissions
    type: simple
    type_params:
      measure:
        name: total_emissions