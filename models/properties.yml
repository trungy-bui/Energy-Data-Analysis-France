models:
  - name: int_energy
    description: Standardized energy summary table
  - name: stg_energy_generation
    description: Standardized energy generation data
    columns:
      - name: date
        description: The date the amount of energy generation was recorded
        tests:
          - not_null
      - name: country
        description: Country
        tests:
          - not_null
      - name: energy_type
        description: The type of energy for the generation
        tests:
          - not_null
      - name: twh
        description: The amount of energy generation in TWH
        tests:
          - not_null
  - name: stg_energy_consumption
    description: Standardized energy consumption data
    columns:
      - name: date
        description: The date the amount of energy generation was recorded
        tests:
          - not_null
      - name: country
        description: Country
        tests:
          - not_null
      - name: energy_type
        description: The type of energy for the generation
        tests:
          - not_null
      - name: twh
        description: The amount of energy generation in TWH
        tests:
          - not_null
  - name: dim_country
    description: Country dimension
    columns:
      - name: country
        description: Country
        tests:
          - unique
          - not_null
      - name: total_generation_twh
        description: The total generation TWH for the country
        tests:
          - not_null
      - name: total_consumption_twh
        description: The total consumption TWH for the country
        tests:
          - not_null
      - name: total_emission_mt
        description: The total emission MT for the country
        tests:
          - not_null
      - name: total_capacity_gw
        description: The total capacity GW for the country
        tests:
          - not_null
  - name: dim_energy_type
    description: Energy type dimension
    columns:
      - name: energy_type
        description: Energy type
        tests:
          - unique
          - not_null
      - name: energy_category
        description: The energy category (Renewable or Fossil Fuel)
        tests:
          - not_null
      - name: is_renewable
        description: A FFlag whether it is renewable or not
        tests:
          - not_null
  - name: fct_emission_intensity
    description: Fact emission intensity table
    columns:
      - name: date
        description: The date the emission intensity was recorded
        tests:
          - not_null
      - name: country
        description: The country where the emission intensity was recorded
        tests:
          - not_null
      - name: total_emissions
        description: The total emissions
        tests:
          - not_null
      - name: total_generation_twh
        description: The total generation
        tests:
          - not_null
  - name: fct_energy_net
    description: Fact energy net table
    columns:
      - name: date
        description: The date the energy net was recorded
        tests:
          - not_null
      - name: country
        description: The country where the energy net was recorded
        tests:
          - not_null
      - name: energy_type
        description: The energy type
        tests:
          - not_null
      - name: energy_category
        description: The energy type
        tests:
          - not_null
      - name: total_generation_twh
        description: Total generation twh
        tests:
          - not_null
      - name: total_consumption_twh
        description: Total consumption twh
        tests:
          - not_null
      - name: total_net_energy
        description: Total net energy
        tests:
          - not_null
